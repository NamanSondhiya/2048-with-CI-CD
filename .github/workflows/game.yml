name = 2048 Game with CI/CD

on:
    push:
        branches:
            - trunk

jobs:
    deploy:
        runs-on:ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Copy 2048 to root
              run: |
                cp -R 2048/* .
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./public